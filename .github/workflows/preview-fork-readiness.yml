name: Flag fork PRs awaiting preview approval

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  flag-fork:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Apply `preview-blocked` label to fork PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --add-label "preview-blocked"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none \
            --body "ℹ️ Fork PR — preview is **not** built automatically. A maintainer can run the \`PR preview\` workflow from the Actions tab to deploy it."
