name: xe-webmcp-evals

services:
  ollama:
    # Multi-platform index: Linux AMD64 and ARM64, Ollama 0.40.2.
    image: ollama/ollama:0.40.2@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
    init: true
    ports:
      - '127.0.0.1:11434:11434'
    environment:
      OLLAMA_HOST: '0.0.0.0:11434'
      # The Go template in this version can omit calls alongside assistant text.
      OLLAMA_GO_TEMPLATE: 'false'
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  ollama-data:
